      "<ruby>外国人<rt>がいこくじん</rt></ruby>が<ruby>失業<rt>しつぎょう</rt></ruby>したときは、その<ruby>日<rt>ひ</rt></ruby>のうちに<ruby>必<rt>かなら</rt></ruby>ず<ruby>母国<rt>ぼこく</rt></ruby>へ<ruby>強制帰国<rt>きょうせいきこく</rt></ruby>しなければならない。",
      "<ruby>雇用保険<rt>こようほけん</rt></ruby>は<ruby>日本人<rt>にほんじん</rt></ruby>だけが<ruby>加入<rt>かにゅう</rt></ruby>でき、<ruby>外国人<rt>がいこくじん</rt></ruby>は<ruby>加入<rt>かにゅう</rt></ruby>することが<ruby>禁止<rt>きんし</rt></ruby>されている。",
      "<ruby>建設業<rt>けんせつぎょう</rt></ruby>では<ruby>若者<rt>わかもの</rt></ruby>や<ruby>外国人<rt>がいこくじん</rt></ruby>の<ruby>育成<rt>いくせい</rt></ruby>のために<ruby>職業訓練<rt>しょくぎょうくんれん</rt></ruby>を<ruby>行<rt>おこな</rt></ruby>ってはならないと<ruby>定<rt>さだ</rt></ruby>められている。"
    ],
    answer: 0,
    hintId: "Pekerja asing Tokutei Ginou berhak atas tunjangan asuransi pengangguran, dan lulus ujian keterampilan berhak bergelar Ginoushi.",
    hintNe: "तोकुतेइ गिनौ कामदारले पनि बेरोजगारी बिमा सुविधा पाउँछन् र सीप परीक्षा पास गरेमा 'गिनौशी' (दक्ष प्राविधिक) को उपाधि पाउँछन्।",
    expJa: "特定技能外国人も失業時に給付を受けることが可能です。技能検定に合格すると合格証書が交付され「技能士」と名乗ることができます（テキストp.15-17）。",
    expId: "Pekerja asing berhak atas manfaat asuransi pengangguran dan sertifikasi negara Ginoushi setelah lulus uji kompetensi.",
    expNe: "विदेशी कामदारले पनि काम छुटेमा बेरोजगारी भत्ता पाउने अधिकार हुन्छ र सीप परीक्षा उत्तीर्ण भएपछि राष्ट्रिय प्रमाणपत्र पाइन्छ।"
  }
];

let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);

function openMenu() {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").style.display = "block";
}

function closeMenu() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").style.display = "none";
}

function updateMenuBadges() {
  const keys = [
    { id: "badge-shokucho", key: "score_shokucho" },
    { id: "badge-gakka1", key: "score_gakka1" },
    { id: "badge-gakka1-2", key: "score_gakka1_2" },
    { id: "badge-gakka2", key: "score_gakka2" }
  ];
  keys.forEach(item => {
    const val = localStorage.getItem(item.key);
    const badge = document.getElementById(item.id);
    if (val && badge) {
      badge.textContent = `✔ ${val}点`;
      badge.style.display = "inline-block";
    }
  });
}

function renderNav() {
  const grid = document.getElementById("nav-grid");
  grid.innerHTML = "";
  questions.forEach((_, i) => {
    const btn = document.createElement("button");
    btn.className = `nav-btn ${i === currentIndex ? "current" : ""} ${userAnswers[i] !== null ? "answered" : ""}`;
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; loadQuestion(); };
    grid.appendChild(btn);
  });
  document.getElementById("current-num").textContent = currentIndex + 1;
  document.getElementById("total-num").textContent = questions.length;
  const answered = userAnswers.filter(a => a !== null).length;
  document.getElementById("answered-count").textContent = `解答済: ${answered} 問`;
}

function loadQuestion() {
  renderNav();
  const q = questions[currentIndex];
  document.getElementById("q-category").textContent = `分野: ${q.cat}`;
  document.getElementById("q-text").innerHTML = q.q;

  document.getElementById("hint-id").textContent = q.hintId;
  document.getElementById("hint-id").style.display = "none";
  document.getElementById("hint-ne").textContent = q.hintNe;
  document.getElementById("hint-ne").style.display = "none";

  const optBox = document.getElementById("options-box");
  optBox.innerHTML = "";
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = `option-btn ${userAnswers[currentIndex] === idx ? "selected" : ""}`;
    btn.innerHTML = `<strong>${idx + 1}.</strong> <span>${opt}</span>`;
    btn.onclick = () => selectOption(idx);
    optBox.appendChild(btn);
  });

  document.getElementById("btn-prev").disabled = currentIndex === 0;
  const isLast = currentIndex === questions.length - 1;
  const btnNext = document.getElementById("btn-next");
  btnNext.textContent = isLast ? "採点する" : "次へ";
}

function selectOption(idx) {
  userAnswers[currentIndex] = idx;
  loadQuestion();
}

function toggleHint(lang) {
  const el = document.getElementById(`hint-${lang}`);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function prevQuestion() {
  if (currentIndex > 0) { currentIndex--; loadQuestion(); }
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    finishQuiz();
  }
}

function skipQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    const firstUnanswered = userAnswers.findIndex(a => a === null);
    if (firstUnanswered !== -1) {
      currentIndex = firstUnanswered;
      loadQuestion();
    } else {
      finishQuiz();
    }
  }
}

function finishQuiz() {
  const unanswered = userAnswers.filter(a => a === null).length;
  if (unanswered > 0) {
    if (!confirm(`まだ解いていない問題が ${unanswered} 問あります。採点してよろしいですか？`)) {
      const firstUnanswered = userAnswers.findIndex(a => a === null);
      if (firstUnanswered !== -1) {
        currentIndex = firstUnanswered;
        loadQuestion();
      }
      return;
    }
  }

  document.getElementById("quiz-view").style.display = "none";
  document.getElementById("result-view").style.display = "block";

  let score = 0;
  const reviewBox = document.getElementById("review-box");
  reviewBox.innerHTML = "";

  questions.forEach((q, i) => {
    const isCorrect = userAnswers[i] === q.answer;
    if (isCorrect) score++;

    const item = document.createElement("div");
    item.className = "review-item";
    
    const yourChoiceText = userAnswers[i] !== null 
      ? `<strong>${userAnswers[i] + 1}.</strong> ${q.options[userAnswers[i]]}` 
      : "（<ruby>未解答<rt>みかいとう</rt></ruby>）";
      
    const correctChoiceText = `<strong>${q.answer + 1}.</strong> ${q.options[q.answer]}`;

    item.innerHTML = `
      <div style="margin-bottom: 8px;">
        <span class="badge ${isCorrect ? 'badge-ok' : 'badge-ng'}">${isCorrect ? '正解 ◎' : '不正解 ✕'}</span>
        <strong style="margin-left: 8px;"><ruby>問<rt>もん</rt></ruby> ${i + 1}</strong>
        <span style="font-size: 0.8rem; color: var(--text-sub); margin-left: 8px;">(${q.cat})</span>
      </div>
      <div style="font-size: 0.98rem; margin-bottom: 8px; line-height: 2.0;">${q.q}</div>
      <div class="review-ans" style="color: ${isCorrect ? 'var(--success)' : 'var(--danger)'};">
        あなたの<ruby>解答<rt>かいとう</rt></ruby>: ${yourChoiceText}
      </div>
      ${!isCorrect ? `<div class="review-ans" style="color: var(--success); font-weight: 600;">正解: ${correctChoiceText}</div>` : ''}
      <div class="review-exp-box">
        <div>💡 <strong><ruby>解説<rt>かいせつ</rt></ruby>:</strong> ${q.expJa}</div>
        <div class="review-multi-exp">🇮🇩 <strong>ID:</strong> ${q.expId}</div>
        <div class="review-multi-exp">🇳🇵 <strong>NE:</strong> ${q.expNe}</div>
      </div>
    `;
    reviewBox.appendChild(item);
  });

  const finalScore = score * 10;
  localStorage.setItem(MODULE_KEY, finalScore);
  updateMenuBadges();

  document.getElementById("score-text").textContent = `${finalScore} 点 / 100点 (${score} / ${questions.length} 問正解)`;
  const passMsg = document.getElementById("pass-msg");
  if (finalScore >= 70) {
    passMsg.innerHTML = "<strong style='color: var(--success);'>合格基準達成です！素晴らしい！</strong>";
  } else {
    passMsg.innerHTML = "<strong style='color: var(--danger);'>不合格ラインです。もう一度復習しましょう！</strong>";
  }
}

updateMenuBadges();
loadQuestion();
</script>
</body>
</html>
