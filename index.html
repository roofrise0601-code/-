<!DOCTYPE html>
<html lang="ja">
<head>

  <style>

    .nav-btn.current { border-color: var(--primary); color: var(--primary); outline: 2px solid #93c5fd; }

    .hints-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn-hint { font-size: 0.8rem; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
    .hint-box { background: var(--warning-bg); border: 1px solid var(--warning-border); padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; color: #92400e; margin-bottom: 16px; display: none; }
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .option-btn { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: #fff; text-align: left; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { border-color: #cbd5e1; background: #f1f5f9; }
    .option-btn.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); font-weight: 600; }
    .btn-group { display: flex; gap: 10px; }
    .btn-nav { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-primary { background: var(--primary); color: #fff; border: none; }
    .btn-primary:hover { background: var(--primary-hover); }
    #result-view { display: none; }
    .score-card { text-align: center; padding: 24px; background: #eff6ff; border-radius: 12px; border: 1px solid #bfdbfe; margin-bottom: 20px; }

    .review-item { border-bottom: 1px solid var(--border); padding: 16px 0; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }

<body>

<div class="container">
  <div id="quiz-view">
    <header>
      <h1>特定技能2号 建設 対策テスト（職長・安全管理）</h1>
      <div class="status-bar">
        <span>進捗: <strong id="current-num">1</strong> / 10 問</span>
        <span id="answered-count">解答済: 0 問</span>
      </div>
      <div class="nav-grid" id="nav-grid"></div>
    </header>

    <div class="card">

      <div class="q-text" id="q-text"></div>

        <button class="btn-hint" onclick="toggleHint('ne')">💡 ネパール語ヒント</button>
      </div>
      <div class="hint-box" id="hint-id"></div>
      <div class="hint-box" id="hint-ne"></div>

      <div class="options" id="options-box"></div>

      <div class="btn-group">
        <button class="btn-nav" onclick="prevQuestion()" id="btn-prev">前へ</button>
        <button class="btn-nav" onclick="skipQuestion()">あとで解く（スキップ）</button>
        <button class="btn-nav btn-primary" onclick="nextQuestion()" id="btn-next">次へ</button>
      </div>
    </div>
  </div>

  <div id="result-view">
    <div class="score-card">
      <h2>採点結果</h2>
      <div class="score-num" id="score-text"></div>
      <p id="pass-msg"></p>
    </div>
    <div class="card">

      <div id="review-box"></div>
      <button class="btn-nav btn-primary" style="width: 100%; margin-top: 20px;" onclick="location.reload()">もう一度解く</button>
    </div>
  </div>
</div>

let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);

function renderNav() {
  const grid = document.getElementById("nav-grid");
  grid.innerHTML = "";
  questions.forEach((_, i) => {
    const btn = document.createElement("button");
    btn.className = `nav-btn ${i === currentIndex ? "current" : ""} ${userAnswers[i] !== null ? "answered" : ""}`;
    btn.textContent = i + 1;
    btn.onclick = () => { currentIndex = i; loadQuestion(); };
    grid.appendChild(btn);
  });
  document.getElementById("current-num").textContent = currentIndex + 1;
  const answered = userAnswers.filter(a => a !== null).length;
  document.getElementById("answered-count").textContent = `解答済: ${answered} 問`;
}

function loadQuestion() {
  renderNav();
  const q = questions[currentIndex];
  document.getElementById("q-category").textContent = `分野: ${q.cat}`;
  document.getElementById("q-text").innerHTML = q.q;

  document.getElementById("hint-id").textContent = q.hintId;
  document.getElementById("hint-id").style.display = "none";
  document.getElementById("hint-ne").textContent = q.hintNe;
  document.getElementById("hint-ne").style.display = "none";

  const optBox = document.getElementById("options-box");
  optBox.innerHTML = "";
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = `option-btn ${userAnswers[currentIndex] === idx ? "selected" : ""}`;
    btn.innerHTML = `<strong>${idx + 1}.</strong> <span>${opt}</span>`;
    btn.onclick = () => selectOption(idx);
    optBox.appendChild(btn);
  });

  document.getElementById("btn-prev").disabled = currentIndex === 0;
  const isLast = currentIndex === questions.length - 1;
  const btnNext = document.getElementById("btn-next");
  btnNext.textContent = isLast ? "採点する" : "次へ";
}

function selectOption(idx) {
  userAnswers[currentIndex] = idx;
  loadQuestion();
}

function toggleHint(lang) {
  const el = document.getElementById(`hint-${lang}`);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function prevQuestion() {
  if (currentIndex > 0) { currentIndex--; loadQuestion(); }
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    finishQuiz();
  }
}

function skipQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    const firstUnanswered = userAnswers.findIndex(a => a === null);
    if (firstUnanswered !== -1) {
      currentIndex = firstUnanswered;
      loadQuestion();
    } else {
      finishQuiz();
    }
  }
}

function finishQuiz() {
  const unanswered = userAnswers.filter(a => a === null).length;
  if (unanswered > 0) {
    if (!confirm(`まだ解いていない問題が ${unanswered} 問あります。採点してよろしいですか？`)) {
      const firstUnanswered = userAnswers.findIndex(a => a === null);
      if (firstUnanswered !== -1) {
        currentIndex = firstUnanswered;
        loadQuestion();
      }
      return;
    }
  }

  document.getElementById("quiz-view").style.display = "none";
  document.getElementById("result-view").style.display = "block";

  let score = 0;
  const reviewBox = document.getElementById("review-box");
  reviewBox.innerHTML = "";

  questions.forEach((q, i) => {
    const isCorrect = userAnswers[i] === q.answer;
    if (isCorrect) score++;

    const item = document.createElement("div");
    item.className = "review-item";
    item.innerHTML = `
      <div style="margin-bottom: 6px;">
        <span class="badge ${isCorrect ? 'badge-ok' : 'badge-ng'}">${isCorrect ? '正解 ◎' : '不正解 ✕'}</span>
        <strong style="margin-left: 8px;">問 ${i + 1}</strong>
      </div>
      <div style="font-size: 0.95rem; margin-bottom: 8px;">${q.q}</div>
      <div style="font-size: 0.9rem; color: ${isCorrect ? 'var(--success)' : 'var(--danger)'};">
        あなたの解答: ${userAnswers[i] !== null ? (userAnswers[i] + 1) + '. ' + q.options[userAnswers[i]] : '未解答'}
      </div>
      ${!isCorrect ? `<div style="font-size: 0.9rem; color: var(--success); font-weight: 600;">正解: ${q.answer + 1}. ${q.options[q.answer]}</div>` : ''}
      <div style="font-size: 0.85rem; color: var(--text-sub); background: #f8fafc; padding: 8px; border-radius: 6px; margin-top: 8px;">
        💡 <strong>解説:</strong> ${q.exp}
      </div>
    `;
    reviewBox.appendChild(item);
  });

  const percentage = Math.round((score / questions.length) * 100);
  document.getElementById("score-text").textContent = `${score} / ${questions.length} 点 (${percentage}%)`;
  const passMsg = document.getElementById("pass-msg");
  if (percentage >= 75) {
    passMsg.innerHTML = "<strong style='color: var(--success);'>合格基準（75%以上）達成！素晴らしいです！</strong>";
  } else {
    passMsg.innerHTML = "<strong style='color: var(--danger);'>不合格ラインです。解説を読んで復習しましょう！</strong>";
  }
}

loadQuestion();
</script>
</body>
</html>
